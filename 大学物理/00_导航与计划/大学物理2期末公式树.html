<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学物理2期末公式树脑图</title>

  <!-- 引入 Google 字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700;900&display=swap"
    rel="stylesheet">

  <!-- 引入 MathJax 用于动态渲染公式 -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      },
      startup: {
        pageReady: () => {
          return MathJax.startup.defaultPageReady().then(() => {
            console.log('MathJax initial typesetting complete');
          });
        }
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.bootcdn.net/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --bg-dark: #070a13;
      --bg-grid: #0f1322;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;

      /* 章节发光颜色 */
      --color-interference: #06b6d4;
      /* 蓝绿 */
      --color-diffraction: #a855f7;
      /* 紫色 */
      --color-polarization: #f97316;
      /* 橙色 */
      --color-quantum: #22c55e;
      /* 绿色 */
      --color-atomic: #eab308;
      /* 黄色 */

      --card-bg: rgba(18, 25, 41, 0.75);
      --card-border: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', 'Noto Sans SC', sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    /* 顶部面板 */
    header {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 20, 35, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 24px;
      pointer-events: auto;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    header h1 {
      font-size: 20px;
      font-weight: 900;
      background: linear-gradient(to right, #00f2fe, #4facfe);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }

    header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .search-box {
      position: relative;
      margin-bottom: 12px;
    }

    .search-box input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px 6px 32px;
      color: #fff;
      font-family: inherit;
      font-size: 13px;
      width: 100%;
      transition: all 0.3s;
    }

    .search-box input:focus {
      outline: none;
      border-color: #06b6d4;
      background: rgba(255, 255, 255, 0.08);
    }

    .search-box::before {
      content: "🔍";
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
      opacity: 0.6;
    }

    .action-row {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 6px 14px;
      color: #cbd5e1;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .btn.active {
      background: #0f766e;
      border-color: #0d9488;
      box-shadow: 0 0 10px rgba(13, 148, 136, 0.4);
    }

    /* 悬浮操作指引 */
    .guide-tip {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 20, 35, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 8px 16px;
      font-size: 11px;
      color: var(--text-muted);
      pointer-events: none;
      line-height: 1.5;
    }

    /* 画布与网格背景 */
    .viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      cursor: grab;
      background-color: var(--bg-dark);
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: center;
    }

    .viewport:active {
      cursor: grabbing;
    }

    /* 脑图承载容器 */
    .mindmap-container {
      width: 0;
      height: 0;
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      pointer-events: none;
      /* 穿透到节点 */
    }

    /* SVG 连线层 */
    #svg-connections {
      position: absolute;
      top: 0;
      left: 0;
      width: 10000px;
      height: 10000px;
      pointer-events: none;
      z-index: 1;
    }

    .connection-line {
      fill: none;
      stroke-width: 2px;
      stroke-linecap: round;
      transition: d 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    /* 节点树卡片层 */
    .nodes-layer {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: auto;
      /* 允许点击与悬停 */
      transition: left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), top 0.4s cubic-bezier(0.25, 0.8, 0.25, 1), opacity 0.3s;
      z-index: 10;
    }

    /* 各种层级节点的设计样式 */

    /* 根节点 */
    .node-root {
      background: linear-gradient(135deg, #06b6d4, #a855f7);
      border: 2px solid rgba(255, 255, 255, 0.25);
      border-radius: 30px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.4);
      white-space: nowrap;
      cursor: pointer;
    }

    /* 章节节点 */
    .node-chapter {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .node-chapter::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      background-color: var(--node-color);
    }

    .node-chapter.active-node {
      box-shadow: 0 0 15px var(--node-color);
      border-color: var(--node-color);
    }

    /* 小节节点 */
    .node-section {
      background: rgba(18, 25, 41, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      color: #cbd5e1;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .node-section.active-node {
      border-color: var(--node-color);
    }

    /* 公式叶子节点（最丰富） */
    .node-leaf {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px 16px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-left: 4px solid var(--node-color, var(--card-border));
    }

    .node-leaf.active-node {
      border-color: var(--node-color);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05), inset 0 0 10px rgba(255, 255, 255, 0.02);
    }

    .leaf-title {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .leaf-title::after {
      content: "公式卡";
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 4px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }

    /* 公式公式盒 */
    .formula-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 6px;
      padding: 10px 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      cursor: pointer;
      position: relative;
      transition: filter 0.3s, opacity 0.3s;
    }

    .formula-box:hover {
      background: rgba(255, 255, 255, 0.03);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .formula-box:hover::after {
      content: "📋 点击复制 LaTeX";
      position: absolute;
      bottom: 2px;
      right: 6px;
      font-size: 8px;
      color: var(--text-muted);
      opacity: 0.8;
    }

    /* 默写自测模式 */
    .quiz-mode .formula-box {
      filter: blur(5px);
      opacity: 0.4;
    }

    .quiz-mode .formula-box:hover {
      filter: blur(0);
      opacity: 1;
    }

    .leaf-mnemonic {
      background: rgba(255, 255, 255, 0.02);
      border-left: 2px solid var(--node-color);
      padding: 6px 8px;
      font-size: 11px;
      color: #ffedd5;
      margin-bottom: 8px;
      border-radius: 0 4px 4px 0;
      line-height: 1.4;
    }

    /* 绑定关联真题题型（核心需求） */
    .leaf-problems {
      background: rgba(239, 68, 68, 0.05);
      border-left: 2px solid #ef4444;
      padding: 6px 8px;
      font-size: 11px;
      color: #fecdd3;
      border-radius: 0 4px 4px 0;
      line-height: 1.45;
    }

    /* 收起状态圆点标识 */
    .toggle-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #334155;
      border: 2px solid var(--node-color, #64748b);
      position: absolute;
      cursor: pointer;
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.3s;
      transform: translate(-50%, -50%);
    }

    .toggle-dot::before {
      content: "+";
      color: #fff;
      font-size: 10px;
      font-weight: bold;
      line-height: 1;
    }

    .toggle-dot.expanded::before {
      content: "−";
    }

    /* 复制成功浮层 */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #0d9488;
      color: #fff;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    /* 被搜索命中的高亮效果 */
    .match-highlight {
      animation: pulse-border 1.5s infinite alternate;
    }

    @keyframes pulse-border {
      from {
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      }

      to {
        box-shadow: 0 0 25px var(--node-color, #06b6d4), inset 0 0 8px var(--node-color, #06b6d4);
        border-color: var(--node-color, #06b6d4);
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>大学物理 2 期末公式树脑图</h1>
    <p>点击小圆圈收起/展开分支。鼠标拖拽背景移动，滚轮缩放画布。点击公式卡片可直接复制 LaTeX 代码。绑定了对应的常见真题题型，助你精准解题！</p>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索公式、对应真题、口诀...">
    </div>

    <div class="action-row">
      <button class="btn" id="toggleQuizBtn">
        👁️ 切换默写自测模式 (公式模糊)
      </button>
      <button class="btn" onclick="resetView();">
        🎯 居中重置视图
      </button>
    </div>
  </header>

  <div class="guide-tip">
    💡 <b>操作小贴士</b>：<br>
    • 左键拖拽背景：平移画布<br>
    • 鼠标滚轮滑动：放大 / 缩小<br>
    • 点击带数字的圆点：快速展开或收缩子树
  </div>

  <div class="viewport" id="viewport">
    <div class="mindmap-container" id="mindmapContainer">
      <!-- 连线画布 -->
      <svg id="svg-connections">
        <defs>
          <!-- 渐变线定义 -->
          <linearGradient id="grad-left" x1="1" y1="0" x2="0" y2="0">
            <stop offset="0%" stop-color="#a855f7" stop-opacity="0.1" />
            <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
          </linearGradient>
        </defs>
      </svg>

      <!-- 节点卡片容器 -->
      <div class="nodes-layer" id="nodesLayer"></div>
    </div>
  </div>

  <div class="toast" id="toast">LaTeX 公式复制成功！</div>

  <script>
    // 树结构数据源
    const treeData = {
      id: "root",
      name: "大学物理二下半学期复习",
      isRoot: true,
      expanded: true,
      children: [
        {
          id: "c1",
          name: "光的干涉",
          color: "var(--color-interference)",
          side: "left",
          expanded: true,
          children: [
            {
              id: "c1_s1",
              name: "双缝干涉",
              expanded: true,
              children: [
                {
                  id: "c1_s1_l1",
                  name: "相邻条纹间距",
                  formula: "\\Delta x = \\frac{D}{d}\\lambda",
                  mnemonic: "相邻亮条纹或暗条纹间距与屏幕距离、波长成正比，与双缝间距成反比",
                  problems: "【期末真题演练】题库第一页第10题：双缝间距为零点二毫米，屏距离双缝一米，用波长为六百纳米的红光照射。计算相邻明条纹间距。答：条纹间距为三毫米。解法：直接代入公式计算，一乘六百纳米除以零点二毫米，结果为三毫米。若改用四百纳米的紫光，条纹间距变为两毫米。"
                },
                {
                  id: "c1_s1_l2",
                  name: "空间相干性极限",
                  formula: "L = \\frac{bd}{\\lambda}",
                  mnemonic: "口诀：L拉姆等于东北，即 L·λ = b·d（b为北，d为东，所以bd是东北）。条纹刚消失的临界条件。",
                  problems: "【期末真题演练】填空题第二题/题库第一页第七题：发光钨丝宽度为一毫米，用绿色滤光片（波长为五百纳米），双缝间距为二毫米。要使屏上能看到干涉条纹，钨丝与双缝的距离至少为多少？答：至少为四米。解法：条纹刚消失的临界距离等于宽度乘间距除以波长，即一毫米乘以二毫米，再除以五百纳米，得到四米。"
                },
                {
                  id: "c1_s1_l3",
                  name: "干涉条纹衬比度",
                  formula: "V = \\frac{I_{max} - I_{min}}{I_{max} + I_{min}} = \\frac{2\\sqrt{I_1 I_2}}{I_1 + I_2} = \\frac{2 A_1 A_2}{A_1^2 + A_2^2}",
                  mnemonic: "条纹清晰度指标。两强度相等时V=1，其中一个振幅为0时V=0。已知振幅比可用第三式计算。",
                  problems: "【期末真题演练】已知两相干光束的振幅之比为二比一，求相干干涉条纹的衬比度。答：衬比度为五分之四（零点八）。解法：直接代入公式，二乘以二乘以一，除以二的平方加一的平方，得到五分之四。"
                }
              ]
            },
            {
              id: "c1_s2",
              name: "薄膜干涉",
              expanded: true,
              children: [
                {
                  id: "c1_s2_l1",
                  name: "介质片额外光程差",
                  formula: "\\Delta = (n-1)e",
                  mnemonic: "在一侧光路中插入折射率为n、厚度为e的透明介质片，光程差改变量为(n-1)e，中央条纹向插入侧移动",
                  problems: "【期末真题演练】填空题第五题/题库第二页第四十题：在双缝干涉的一条缝后插一块折射率为一点五的云母片，中央明纹移到了原来第五级明纹处，求云母片厚度。答：云母片厚度为六微米。解法：光程差改变量等于五倍波长，即(一点五减一)乘以厚度等于五乘以六百纳米，解得厚度为六微米。"
                },
                {
                  id: "c1_s2_l2",
                  name: "薄膜反射光程差",
                  formula: "\\delta = 2n_2 e \\pm \\frac{\\lambda}{2}",
                  mnemonic: "垂直入射。光从疏介质向密介质表面反射时产生半波损失。上下两个表面只有一个有半波损失时才加减半个波长，都有或都没有则抵消",
                  problems: "【期末真题演练】填空题第九题：白光垂直照射空气中折射率为一点四的油膜，油膜厚度为两百五十纳米。求反射光中哪些可见光波长得到增强。答：波长为七百纳米的红光。解法：由于油膜上下表面都是由光疏到光密反射，均有半波损失，所以反射光程差直接等于两倍折射率乘厚度。相长干涉（增强）条件为两倍折射率乘厚度等于级数乘波长。当级数为一时，波长为七百纳米，属于可见光范围；当级数为二时，波长为三百五十纳米，超出了可见光范围。"
                },
                {
                  id: "c1_s2_l3",
                  name: "劈尖条纹间距",
                  formula: "l = \\frac{\\lambda}{2n\\theta}",
                  mnemonic: "相邻同级明纹或暗纹之间的物理距离与波长成正比，与夹角和介质折射率成反比",
                  problems: "【期末真题演练】填空题第四题：折射率为一点四的劈尖，夹角为万分之二弧度，垂直照射波长为五百六十纳米的光，求条纹间距。答：条纹间距为一毫米。解法：波长除以（两倍折射率乘夹角），即五百六十纳米除以（二乘以一点四乘以万分之二），结果为一毫米。"
                },
                {
                  id: "c1_s2_l4",
                  name: "劈尖厚度变化与测微",
                  formula: "\\Delta h = \\frac{\\lambda}{2n}",
                  mnemonic: "条纹每移动一个，劈尖对应的厚度改变量为半个波长。夹角变大，条纹变密；夹角变小，条纹变稀",
                  problems: "【期末真题演练】平晶测细丝直径：两玻璃板一端叠放，另一端夹直径为D的细丝，形成劈尖。若数得明纹总数为N个，求细丝直径。答：直径为N乘以半个波长。解法：细丝处劈尖厚度即为直径，等于明纹级数乘半个波长。若用手轻按平晶表面，夹角变小，条纹间距变宽，表现为条纹变稀疏。"
                },
                {

    // 脑图逻辑
    let scale = 0.85;
    let translateX = window.innerWidth / 2 - 5000 * scale;
    let translateY = window.innerHeight / 2 - 5000 * scale;
    let isDragging = false;
    let startX, startY;

    const viewport = document.getElementById('viewport');
    const container = document.getElementById('mindmapContainer');
    const nodesLayer = document.getElementById('nodesLayer');
    const svgConnections = document.getElementById('svg-connections');

    // 监听拖拽与缩放
    viewport.addEventListener('mousedown', (e) => {
      // 只有点击背景或线时，才启动画布拖拽
      if (e.target === viewport || e.target.id === 'svg-connections' || e.target.tagName === 'svg' || e.target.tagName === 'path') {
        isDragging = true;
        startX = e.clientX - translateX;
        startY = e.clientY - translateY;
      }
    });

    window.addEventListener('mousemove', (e) => {
      if (isDragging) {
        translateX = e.clientX - startX;
        translateY = e.clientY - startY;
        updateTransform();
      }
    });

    window.addEventListener('mouseup', () => {
      isDragging = false;
    });

    viewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = 1.08;
      const oldScale = scale;
      if (e.deltaY < 0) {
        scale *= zoomFactor;
      } else {
        scale /= zoomFactor;
      }
      scale = Math.min(Math.max(0.25, scale), 2);

      const mouseX = e.clientX - viewport.getBoundingClientRect().left;
      const mouseY = e.clientY - viewport.getBoundingClientRect().top;

      translateX = mouseX - (mouseX - translateX) * (scale / oldScale);
      translateY = mouseY - (mouseY - translateY) * (scale / oldScale);

      updateTransform();
    });

    function updateTransform() {
      container.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    // 重置视图居中
    function resetView() {
      scale = 0.85;
      translateX = window.innerWidth / 2 - 5000 * scale;
      translateY = window.innerHeight / 2 - 5000 * scale;
      updateTransform();
    }

    // 计算每个节点的位置
    function computeLayout(node, parentX, parentY, side = 'left') {
      node.x = parentX;
      node.y = parentY;

      if (node.isRoot) {
        node.x = 0;
        node.y = 0;

        // 分发左右子节点
        const leftChildren = node.children.filter(c => c.side === 'left');
        const rightChildren = node.children.filter(c => c.side === 'right');

        layoutSubtree(leftChildren, 0, 0, -250, 'left');
        layoutSubtree(rightChildren, 0, 0, 250, 'right');
      }
    }

    // 布局某一侧的子树
    function layoutSubtree(siblings, startX, startY, deltaX, side) {
      // 记录高度以方便居中排列
      siblings.forEach(node => {
        node.subHeight = getSubtreeHeight(node);
      });

      const totalHeight = siblings.reduce((sum, n) => sum + n.subHeight, 0);
      let currentY = startY - totalHeight / 2;

      siblings.forEach(node => {
        const nodeY = currentY + node.subHeight / 2;
        node.x = startX + deltaX;
        node.y = nodeY;

        if (node.expanded && node.children) {
          layoutChildren(node.children, node.x, node.y, deltaX * 1.2, side);
        }

        currentY += node.subHeight;
      });
    }

    // 布局深层子代节点
    function layoutChildren(children, parentX, parentY, deltaX, side) {
      children.forEach(node => {
        node.subHeight = getSubtreeHeight(node);
      });

      const totalHeight = children.reduce((sum, n) => sum + n.subHeight, 0);
      let currentY = parentY - totalHeight / 2;

      children.forEach(node => {
        const nodeY = currentY + node.subHeight / 2;
        node.x = parentX + deltaX;
        node.y = nodeY;

        if (node.expanded && node.children) {
          const nextDeltaX = side === 'left' ? -380 : 380;
          layoutChildren(node.children, node.x, node.y, nextDeltaX, side);
        }

        currentY += node.subHeight;
      });
    }

    // 递归获取子树所需的总像素高度
    function getSubtreeHeight(node) {
      if (!node.expanded || !node.children || node.children.length === 0) {
        // 叶子卡片占的高度
        if (node.formula) return 400; // 公式卡片高度设置为 400px 以留出足够的间距防止重叠
        return 70; // 章节、小节单行节点高
      }

      // 子节点所需高度之和
      const sum = node.children.reduce((acc, child) => acc + getSubtreeHeight(child), 0);
      return Math.max(sum, 70);
    }

    // 展开并缓存所有节点关系
    let allNodesMap = new Map();
    let parentChildLinks = [];

    function flattenTree(node, parent = null, chapterColor = '') {
      node.chapterColor = chapterColor || node.color || '';
      allNodesMap.set(node.id, node);

      if (parent) {
        parentChildLinks.push({
          parent: parent.id,
          child: node.id,
          color: node.chapterColor || parent.chapterColor
        });
      }

      if (node.children) {
        node.children.forEach(child => {
          flattenTree(child, node, node.chapterColor);
        });
      }
    }

    // 绘制脑图
    function renderMindmap() {
      // 1. 清空图层
      nodesLayer.innerHTML = '';

      // 2. 重新计算每个坐标
      computeLayout(treeData);

      // 3. 渲染卡片
      allNodesMap.forEach((node) => {
        // 假如父节点被收起来，子节点隐藏不画
        if (!isNodeVisible(node)) return;

        const div = document.createElement('div');
        div.className = `node`;
        div.id = `el-${node.id}`;

        // 设置对应发光配色
        if (node.chapterColor) {
          div.style.setProperty('--node-color', node.chapterColor);
        }

        // 填充层级样式
        if (node.isRoot) {
          div.classList.add('node-root');
          div.innerHTML = node.name;
        } else if (node.children && node.id.startsWith('c') && !node.id.includes('_')) {
          div.classList.add('node-chapter');
          div.innerHTML = node.name;
          addToggleButton(node, div);
        } else if (node.children) {
          div.classList.add('node-section');
          div.innerHTML = node.name;
          addToggleButton(node, div);
        } else {
          // 公式叶子节点
          div.classList.add('node-leaf');
          div.innerHTML = `
            <div class="leaf-title">${node.name}</div>
            <div class="formula-box" data-latex="${node.formula}">
              $$${node.formula}$$
            </div>
            ${node.mnemonic ? `<div class="leaf-mnemonic">💡 <b>记忆口诀：</b>${node.mnemonic}</div>` : ''}
            <div class="leaf-problems">${node.problems}</div>
          `;
        }

        // 定位卡片
        div.style.left = `${node.x + 5000}px`; // 偏移防止负坐标
        div.style.top = `${node.y + 5000}px`;

        // 绑定点击复制公式
        const box = div.querySelector('.formula-box');
        if (box) {
          box.addEventListener('click', (e) => {
            e.stopPropagation();
            const latex = box.getAttribute('data-latex');
            navigator.clipboard.writeText(latex).then(() => {
              showToast();
            });
          });
        }

        // 绑定节点收起展开
        if (node.children) {
          div.addEventListener('click', (e) => {
            // 点击节点文字也可以展开收缩
            node.expanded = !node.expanded;
            renderMindmap();
          });
        }

        nodesLayer.appendChild(div);
      });

      // 4. 画连线
      drawConnections();

      // 5. 触发MathJax动态解析生成公式
      if (window.MathJax && MathJax.typesetPromise) {
        MathJax.typesetPromise();
      }
    }

    // 检查节点是否因为祖先收起而被隐藏
    function isNodeVisible(node) {
      if (node.isRoot) return true;
      let parent = getParentNode(node.id);
      while (parent) {
        if (!parent.expanded) return false;
        parent = getParentNode(parent.id);
      }
      return true;
    }

    function getParentNode(childId) {
      const link = parentChildLinks.find(l => l.child === childId);
      return link ? allNodesMap.get(link.parent) : null;
    }

    // 添加卡片侧边的收拢小圆圈按钮
    function addToggleButton(node, element) {
      const dot = document.createElement('div');
      dot.className = `toggle-dot ${node.expanded ? 'expanded' : ''}`;

      if (node.chapterColor) {
        dot.style.setProperty('--node-color', node.chapterColor);
      }

      // 根据左侧/右侧，把圆圈放在卡片的右端或左端
      const side = getSubtreeSide(node.id);
      if (side === 'left') {
        dot.style.left = '-12px';
      } else {
        dot.style.right = '-12px';
      }
      dot.style.top = '50%';

      dot.addEventListener('click', (e) => {
        e.stopPropagation(); // 阻止穿透
        node.expanded = !node.expanded;
        renderMindmap();
      });

      element.appendChild(dot);
    }

    function getSubtreeSide(nodeId) {
      let current = allNodesMap.get(nodeId);
      while (current) {
        if (current.side) return current.side;
        current = getParentNode(current.id);
      }
      return 'left';
    }

    // 绘制SVG三次贝塞尔曲线
    function drawConnections() {
      // 清空SVG
      const paths = svgConnections.querySelectorAll('path');
      paths.forEach(p => p.remove());

      parentChildLinks.forEach(link => {
        const parent = allNodesMap.get(link.parent);
        const child = allNodesMap.get(link.child);

        // 只有当两个节点都可见时，才画连线
        if (isNodeVisible(parent) && isNodeVisible(child)) {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');

          const startX = parent.x + 5000;
          const startY = parent.y + 5000;
          const endX = child.x + 5000;
          const endY = child.y + 5000;

          // 贝塞尔控制点横向拉伸弯曲
          const controlX1 = startX + (endX - startX) * 0.45;
          const controlY1 = startY;
          const controlX2 = startX + (endX - startX) * 0.55;
          const controlY2 = endY;

          const dAttribute = `M ${startX} ${startY} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${endX} ${endY}`;

          path.setAttribute('d', dAttribute);
          path.setAttribute('class', 'connection-line');

          const strokeColor = link.color || '#334155';
          path.setAttribute('stroke', strokeColor);

          // 给连线加上漂亮的柔和光晕
          path.style.filter = `drop-shadow(0 0 3px ${strokeColor})`;
          path.style.opacity = '0.55';

          svgConnections.appendChild(path);
        }
      });
    }

    // 成功复制浮层提示
    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1500);
    }

    // 切换模糊状态
    const toggleQuizBtn = document.getElementById('toggleQuizBtn');
    let quizMode = false;
    toggleQuizBtn.addEventListener('click', () => {
      quizMode = !quizMode;
      if (quizMode) {
        document.body.classList.add('quiz-mode');
        toggleQuizBtn.classList.add('active');
        toggleQuizBtn.innerHTML = '👁️ 退出默写自测模式';
      } else {
        document.body.classList.remove('quiz-mode');
        toggleQuizBtn.classList.remove('active');
        toggleQuizBtn.innerHTML = '👁️ 切换默写自测模式 (公式模糊)';
      }
    });

    // 搜索过滤与高亮
    const searchInput = document.getElementById('searchInput');

    searchInput.addEventListener('input', function () {
      const query = this.value.toLowerCase().trim();

      // 去掉之前所有节点的高亮
      allNodesMap.forEach(node => {
        const el = document.getElementById(`el-${node.id}`);
        if (el) el.classList.remove('match-highlight');
      });

      if (query === '') return;

      // 递归寻找包含查找内容的叶子，自动展开它们的路径
      allNodesMap.forEach(node => {
        if (!node.children) {
          const matchTitle = node.name.toLowerCase().includes(query);
          const matchFormula = node.formula.toLowerCase().includes(query);
          const matchMnemonic = node.mnemonic ? node.mnemonic.toLowerCase().includes(query) : false;
          const matchProblems = node.problems.toLowerCase().includes(query);

          if (matchTitle || matchFormula || matchMnemonic || matchProblems) {
            // 亮起叶子本身
            const leafEl = document.getElementById(`el-${node.id}`);
            if (leafEl) leafEl.classList.add('match-highlight');

            // 逆向强行将祖先都展开，使该公式能被看见
            let parent = getParentNode(node.id);
            while (parent) {
              if (!parent.expanded) {
                parent.expanded = true;
                renderMindmap(); // 重新渲染刷新视图
              }
              parent = getParentNode(parent.id);
            }
          }
        }
      });
    });

    // 初始化运行
    flattenTree(treeData);
    resetView();
    renderMindmap();

    // 缩放窗口时重定大小
    window.addEventListener('resize', () => {
      updateTransform();
    });
  </script>
</body>

</html>
